[package]
name = "satellite-datetime-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "3D real-time visualizer for the satellite-datetime crate"
repository = "https://github.com/SSC-SDE/satellite-datetime-demo"
readme = "README.md"
publish = false

[dependencies]
bevy = { version = "0.16.1", default-features = true }
satellite-datetime = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
